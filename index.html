<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IngressosFácil - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cor-texto: #f5f5f5;
            --rgb-claro: 255, 255, 255;
        }

        body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            background: #000;
            color: var(--cor-texto);
            overflow-x: hidden;
        }

        /* ===== Fundo ===== */
        .fundo {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 0%, #1a1a1a 0%, #000 65%);
        }

        /* Manchas de luz desfocadas, em tons de cinza */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            background: #fff;
            opacity: .1;
            will-change: transform;
        }
        .blob-1 {
            width: 460px; height: 460px;
            top: -140px; left: -120px;
            animation: flutuar1 24s ease-in-out infinite;
        }
        .blob-2 {
            width: 520px; height: 520px;
            bottom: -180px; right: -140px;
            animation: flutuar2 28s ease-in-out infinite;
        }
        .blob-3 {
            width: 300px; height: 300px;
            top: 45%; left: 50%;
            opacity: .06;
            animation: flutuar3 32s ease-in-out infinite;
        }

        @keyframes flutuar1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(200px, 160px) scale(1.2); }
        }
        @keyframes flutuar2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-220px, -140px) scale(1.2); }
        }
        @keyframes flutuar3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-160px, 100px) scale(.8); }
        }

        /* Constelações */
        #constelacao {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* ===== Conteúdo ===== */
        .marca {
            color: #fff;
            font-weight: 700;
            letter-spacing: -.5px;
        }
        .marca span { color: #a3a3a3; }

        .subtitulo-marca {
            color: rgba(255, 255, 255, .6);
            font-size: .95rem;
        }

        /* Cartão de vidro */
        .card-cadastro {
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, .06);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            backdrop-filter: blur(22px) saturate(140%);
            box-shadow: 0 25px 60px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .12);
            overflow: hidden;
            color: var(--cor-texto);
            animation: entrar .6s ease both;
        }
        .card-cadastro::before {
            content: "";
            display: block;
            height: 3px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            opacity: .7;
        }

        @keyframes entrar {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .titulo-card { font-weight: 600; }

        .form-label {
            font-size: .85rem;
            font-weight: 500;
            color: rgba(255, 255, 255, .75);
        }

        .form-control,
        .form-select {
            border-radius: .75rem;
            padding: .7rem 1rem;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, .15);
            background-color: rgba(255, 255, 255, .06);
            transition: border-color .2s, box-shadow .2s, background-color .2s;
        }
        .form-control::placeholder { color: rgba(255, 255, 255, .35); }
        .form-control:focus,
        .form-select:focus {
            color: #fff;
            background-color: rgba(255, 255, 255, .1);
            border-color: #fff;
            box-shadow: 0 0 0 .25rem rgba(var(--rgb-claro), .15);
        }
        .form-select option { color: #000; }
        .form-select {
            --bs-form-select-bg-img: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
        }

        .form-check-input {
            background-color: rgba(255, 255, 255, .08);
            border-color: rgba(255, 255, 255, .35);
        }
        .form-check-input:checked {
            background-color: #fff;
            border-color: #fff;
            --bs-form-check-bg-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3cpath fill='none' stroke='%23000' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='m6 10 3 3 6-6'/%3e%3c/svg%3e");
        }
        .form-check-input:focus {
            border-color: #fff;
            box-shadow: 0 0 0 .25rem rgba(var(--rgb-claro), .15);
        }
        .form-check-label { color: rgba(255, 255, 255, .75); }

        .btn-cadastrar {
            border: 0;
            border-radius: .75rem;
            padding: .8rem 1rem;
            font-weight: 600;
            color: #000;
            background: #fff;
            box-shadow: 0 8px 24px rgba(var(--rgb-claro), .18);
            transition: transform .15s, box-shadow .15s, background-color .15s;
        }
        .btn-cadastrar:hover {
            color: #000;
            background: #e5e5e5;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(var(--rgb-claro), .3);
        }
        .btn-cadastrar:active { transform: translateY(0); }

        .alert {
            border-radius: .75rem;
            font-size: .92rem;
            animation: entrar .35s ease both;
        }
        .alert-success {
            background: rgba(255, 255, 255, .12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .5);
        }
        .alert-danger {
            background: rgba(255, 255, 255, .04);
            color: #d4d4d4;
            border: 1px dashed rgba(255, 255, 255, .4);
        }

        .rodape {
            color: rgba(255, 255, 255, .45);
            font-size: .8rem;
        }
    </style>
</head>
<body>

    <div class="fundo" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <canvas id="constelacao"></canvas>
    </div>

    <main class="container py-5">
        <div class="text-center mb-4">
            <h1 class="h2 marca mb-1">Ingressos<span>Fácil</span></h1>
            <p class="subtitulo-marca mb-0">Seus eventos favoritos em um só lugar</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card card-cadastro">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="h4 titulo-card mb-1">Criar conta</h2>
                        <p class="small mb-4" style="color: rgba(255,255,255,.55);">Preencha os dados abaixo para começar.</p>

                        <div id="alerta-cadastro" class="alert" role="alert" hidden></div>

                        <form id="form-cadastro">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome completo</label>
                                <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="voce@exemplo.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" minlength="8" required>
                            </div>
                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoria preferida</label>
                                <select class="form-select" id="categoria" name="categoria" required>
                                    <option value="">Selecione...</option>
                                    <option value="show">Shows</option>
                                    <option value="comedia">Comédia</option>
                                    <option value="esporte">Esportes</option>
                                    <option value="gastronomia">Gastronomia</option>
                                </select>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="termos" name="termos" required>
                                <label class="form-check-label small" for="termos">Li e aceito os termos de uso</label>
                            </div>
                            <button type="submit" class="btn btn-cadastrar w-100">Cadastrar</button>
                        </form>
                    </div>
                </div>
                <p class="rodape text-center mt-4 mb-0">&copy; 2026 IngressosFácil</p>
            </div>
        </div>
    </main>

    <script>
        // ===== Constelações no fundo =====
        (function () {
            const canvas = document.getElementById("constelacao");
            const ctx = canvas.getContext("2d");
            const reduzir = false;   // animação sempre ligada
            const DISTANCIA = 140;
            let largura, altura, estrelas = [], estrelaCadente = null;
            const mouse = { x: null, y: null };
            const par = { x: 0, y: 0, tx: 0, ty: 0 };   // paralaxe suavizada

            function ajustar() {
                const dpr = window.devicePixelRatio || 1;
                largura = window.innerWidth;
                altura = window.innerHeight;
                canvas.width = largura * dpr;
                canvas.height = altura * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const quantidade = Math.min(130, Math.floor((largura * altura) / 11000));
                estrelas = Array.from({ length: quantidade }, () => ({
                    bx: Math.random() * largura,   // posição base (deriva sozinha)
                    by: Math.random() * altura,
                    x: 0, y: 0,                    // posição desenhada
                    ox: 0, oy: 0,                  // deslocamento causado pelo mouse
                    z: 0.3 + Math.random() * 1.2,  // profundidade (paralaxe)
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    r: 0.6 + Math.random() * 1.6,
                    fase: Math.random() * Math.PI * 2,
                    brilho: 0.012 + Math.random() * 0.025
                }));
            }

            function novaEstrelaCadente() {
                estrelaCadente = {
                    x: Math.random() * largura * 0.8,
                    y: Math.random() * altura * 0.4,
                    vx: 9 + Math.random() * 5,
                    vy: 4 + Math.random() * 3,
                    vida: 1
                };
            }

            function desenhar() {
                ctx.clearRect(0, 0, largura, altura);

                // Paralaxe e atração do mouse
                par.x += (par.tx - par.x) * 0.06;
                par.y += (par.ty - par.y) * 0.06;
                const RAIO = 200;
                for (const e of estrelas) {
                    let alvoX = 0, alvoY = 0;
                    if (mouse.x !== null) {
                        const dx = mouse.x - (e.bx + par.x * e.z);
                        const dy = mouse.y - (e.by + par.y * e.z);
                        const dist = Math.hypot(dx, dy);
                        if (dist < RAIO && dist > 1) {
                            const forca = (1 - dist / RAIO);
                            alvoX = (dx / dist) * forca * 70;
                            alvoY = (dy / dist) * forca * 70;
                        }
                    }
                    e.ox += (alvoX - e.ox) * 0.08;
                    e.oy += (alvoY - e.oy) * 0.08;
                    e.x = e.bx + par.x * e.z + e.ox;
                    e.y = e.by + par.y * e.z + e.oy;
                }

                // Linhas entre estrelas próximas
                for (let i = 0; i < estrelas.length; i++) {
                    const a = estrelas[i];
                    for (let j = i + 1; j < estrelas.length; j++) {
                        const b = estrelas[j];
                        const d = Math.hypot(a.x - b.x, a.y - b.y);
                        if (d < DISTANCIA) {
                            ctx.strokeStyle = `rgba(255,255,255,${(1 - d / DISTANCIA) * 0.35})`;
                            ctx.lineWidth = 0.7;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.stroke();
                        }
                    }
                    // Linhas até o cursor
                    if (mouse.x !== null) {
                        const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y);
                        if (dm < 180) {
                            ctx.strokeStyle = `rgba(255,255,255,${(1 - dm / 180) * 0.6})`;
                            ctx.lineWidth = 0.9;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }
                }

                // Estrelas
                for (const e of estrelas) {
                    e.fase += e.brilho;
                    const alfa = 0.55 + Math.sin(e.fase) * 0.45;
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255,255,255,${alfa})`;
                    ctx.shadowColor = "rgba(255,255,255,0.9)";
                    ctx.shadowBlur = e.r * 4;
                    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (!reduzir) {
                        e.bx += e.vx;
                        e.by += e.vy;
                        if (e.bx < -80) e.bx = largura + 80;
                        if (e.bx > largura + 80) e.bx = -80;
                        if (e.by < -80) e.by = altura + 80;
                        if (e.by > altura + 80) e.by = -80;
                    }
                }

                // Estrela cadente
                if (estrelaCadente && !reduzir) {
                    const s = estrelaCadente;
                    const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 9, s.y - s.vy * 9);
                    grad.addColorStop(0, `rgba(255,255,255,${s.vida})`);
                    grad.addColorStop(1, "rgba(255,255,255,0)");
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y);
                    ctx.lineTo(s.x - s.vx * 9, s.y - s.vy * 9);
                    ctx.stroke();
                    s.x += s.vx;
                    s.y += s.vy;
                    s.vida -= 0.012;
                    if (s.vida <= 0) estrelaCadente = null;
                }
            }

            function animar() {
                desenhar();
                if (!reduzir) requestAnimationFrame(animar);
            }

            window.addEventListener("resize", ajustar);
            window.addEventListener("mousemove", function (ev) {
                mouse.x = ev.clientX;
                mouse.y = ev.clientY;
                par.tx = -(ev.clientX / largura - 0.5) * 70;
                par.ty = -(ev.clientY / altura - 0.5) * 70;
            });
            document.addEventListener("mouseleave", function () {
                mouse.x = mouse.y = null;
                par.tx = par.ty = 0;
            });

            ajustar();
            animar();
            if (!reduzir) {
                setInterval(function () {
                    if (!estrelaCadente) novaEstrelaCadente();
                }, 6000);
            }
        })();

        // ===== Elementos da página =====
        const formCadastro = document.getElementById("form-cadastro");
        const nome = document.getElementById("nome");
        const email = document.getElementById("email");
        const senha = document.getElementById("senha");
        const categoria = document.getElementById("categoria");
        const termos = document.getElementById("termos");
        const alertaCadastro = document.getElementById("alerta-cadastro");

        // ===== Função que mostra o alerta =====
        function mostrarAlerta(texto, tipo) {
            alertaCadastro.textContent = texto;
            alertaCadastro.className = "alert alert-" + tipo;
            alertaCadastro.hidden = false;
        }

        // ===== Envio do formulário =====
        formCadastro.addEventListener("submit", function (event) {
            event.preventDefault();

            const usuario = {
                nome: nome.value.trim(),
                email: email.value.trim().toLowerCase(),
                senha: senha.value,
                categoria: categoria.value,
                aceitouTermos: termos.checked
            };

            const nomeCategoria = categoria.selectedOptions[0].textContent;

            mostrarAlerta(
                `Cadastro realizado, ${usuario.nome}! E-mail: ${usuario.email}. Categoria preferida: ${nomeCategoria}.`,
                "success"
            );

            formCadastro.reset();
        });
    </script>
</body>
</html>
